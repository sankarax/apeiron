[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "apeiron-engine"
version = "0.1.0"
description = "High-performance artificial life and evolutionary simulation engine"
requires-python = ">=3.10"

[tool.maturin]
features = ["extension-module"]
module-name = "apeiron_engine"