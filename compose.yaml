name: apeiron

services:
  postgres:
    image: postgres:17-alpine
    container_name: apeiron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apeiron
      POSTGRES_USER: apeiron
      POSTGRES_PASSWORD: apeiron_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apeiron -d apeiron"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: apeiron-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: